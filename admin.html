<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>採用サイト 管理画面</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="site"><div class="wrap">
  <div class="logo">採用サイト 管理</div>
  <a href="index.html" target="_blank" class="tag">本サイトを見る ↗</a>
</div></header>

<!-- ===== ログイン ===== -->
<main id="viewLogin"><div class="wrap">
  <div class="card">
    <h1 class="job-title" style="font-size:20px">ログイン</h1>
    <div class="notice" id="noGas" hidden>GAS_URLが未設定です（config.js）。保存はできませんが、画面の確認はできます。</div>
    <label class="f">管理パスワード</label>
    <input type="password" id="pw" autocomplete="current-password">
    <div class="error" id="loginErr"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:16px">ログイン</button>
  </div>
</div></main>

<!-- ===== 編集 ===== -->
<main id="viewEdit" hidden><div class="wrap">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">アクセス状況</h2>
      <button class="icon-btn" id="statsReload">更新</button>
    </div>
    <div id="stats"><p class="hint">読み込み中…</p></div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">基本情報</h2>
    <label class="f">店名</label><input type="text" data-k="storeName">
    <label class="f">求人タイトル（職種）</label><input type="text" data-k="jobTitle">
    <label class="f">キャッチコピー</label><textarea data-k="catchcopy" style="min-height:60px"></textarea>
    <label class="f">雇用形態（タグ表示）</label><input type="text" data-k="employmentType">
    <label class="f">給与（タグ表示）</label><input type="text" data-k="salaryShort">
    <label class="f">勤務地（タグ表示）</label><input type="text" data-k="locationShort">
  </div>

  <div class="card">
    <h2 style="margin-top:0">写真（最大4枚）</h2>
    <p class="hint">スマホのアルバムから選べます。1枚目がトップに大きく表示されます。</p>
    <div class="img-grid" id="imgGrid"></div>
    <input type="file" id="imgInput" accept="image/*" multiple hidden>
  </div>

  <div class="card">
    <h2 style="margin-top:0">求人詳細の項目</h2>
    <p class="hint">給与・勤務地・仕事内容などを自由に追加・並べ替えできます</p>
    <div id="secList"></div>
    <button class="icon-btn" id="addSec">＋ 項目を追加</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0">応募完了メッセージ</h2>
    <textarea data-k="completeMessage"></textarea>
  </div>

  <div class="sticky-cta"><div class="wrap toolbar">
    <button class="btn btn-ghost" id="logoutBtn">ログアウト</button>
    <button class="btn btn-ghost" id="resetBtn">初期値に戻す</button>
    <button class="btn btn-primary" id="saveBtn" style="flex:1">保存して公開</button>
  </div></div>
</div></main>

<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let C = structuredClone(DEFAULT_CONTENT);
let PW = sessionStorage.getItem("recruit_pw") || "";

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2500); }
async function post(body){
  const r = await fetch(GAS_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body) });
  return r.json();
}

if (!GAS_URL) $("noGas").hidden = false;

$("loginBtn").onclick = async () => {
  const pw = $("pw").value; $("loginErr").textContent = "";
  if (!GAS_URL) { enter(); return; }
  $("loginBtn").disabled = true;
  try {
    const j = await post({ action:"login", password: pw });
    if (!j.ok) throw new Error(j.error || "パスワードが違います");
    PW = pw; sessionStorage.setItem("recruit_pw", pw); await enter();
  } catch(e){ $("loginErr").textContent = e.message; }
  finally { $("loginBtn").disabled = false; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

async function enter(){
  if (GAS_URL) {
    try {
      const j = await (await fetch(GAS_URL + "?action=content")).json();
      if (j.ok && j.content) C = Object.assign(structuredClone(DEFAULT_CONTENT), j.content);
    } catch(e){ toast("読み込みに失敗しました"); }
  }
  fill();
  $("viewLogin").hidden = true; $("viewEdit").hidden = false;
  try { localStorage.setItem("recruit_admin", "1"); } catch(e){} // この端末からの閲覧は数えない
  loadStats();
}

function fill(){
  document.querySelectorAll("[data-k]").forEach(el => el.value = C[el.dataset.k] ?? "");
  renderSecs();
  renderImgs();
}

// ===== 画像 =====
const MAX_IMG = 4;
let uploading = 0;
function renderImgs(){
  C.images = C.images || [];
  let h = C.images.map((u,i) => `
    <div class="img-item">
      <img src="${esc(u)}" alt="">
      ${i === 0 ? '<span class="badge">トップ</span>' : ''}
      <div class="ops">
        ${i > 0 ? `<button data-img="left" data-i="${i}" title="前へ">←</button>` : ''}
        <button data-img="del" data-i="${i}" title="削除">✕</button>
      </div>
    </div>`).join("");
  for (let k = 0; k < uploading; k++) h += `<div class="img-add">アップロード中…</div>`;
  if (C.images.length + uploading < MAX_IMG) h += `<label class="img-add" for="imgInput"><b>＋</b>写真を追加</label>`;
  $("imgGrid").innerHTML = h;
}
$("imgGrid").addEventListener("click", e => {
  const b = e.target.closest("[data-img]"); if (!b) return;
  const i = +b.dataset.i, a = C.images;
  if (b.dataset.img === "del" && confirm("この写真を外しますか？")) a.splice(i,1);
  if (b.dataset.img === "left") [a[i-1],a[i]] = [a[i],a[i-1]];
  renderImgs();
});
$("imgInput").addEventListener("change", async e => {
  const files = [...e.target.files].slice(0, MAX_IMG - C.images.length - uploading);
  e.target.value = "";
  if (!files.length) return;
  if (!GAS_URL) { toast("GAS_URL未設定のためアップロードできません"); return; }
  uploading += files.length; renderImgs();
  for (const file of files) {
    try {
      const data = await resizeImage(file, 1600, 0.82);
      const j = await post({ action:"uploadImage", password: PW, data, name: file.name });
      if (!j.ok) throw new Error(j.error);
      C.images.push(j.url);
    } catch(err) { toast("アップロード失敗：" + err.message); }
    uploading--; renderImgs();
  }
  toast("「保存して公開」を押すと本サイトに反映されます");
});
// スマホ写真を長辺1600pxのJPEGに縮小してから送信（通信量と表示速度対策）
function resizeImage(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q).split(",")[1]);
    };
    img.onerror = () => rej(new Error("画像を読み込めませんでした"));
    img.src = url;
  });
}

// ===== アクセス状況 =====
const SRC_LABEL = { qr:"QRコード", indeed:"Indeed", instagram:"Instagram", google:"Google検索", line:"LINE", direct:"直接・不明", other:"その他" };
async function loadStats(){
  if (!GAS_URL) { $("stats").innerHTML = '<p class="hint">GAS_URL未設定</p>'; return; }
  $("stats").innerHTML = '<p class="hint">読み込み中…</p>';
  try {
    const j = await post({ action:"stats", password: PW });
    if (!j.ok) throw new Error(j.error);
    const s = j.stats, rate = (a,v) => v ? (a / v * 100).toFixed(1) + "%" : "-";
    const box = (label, o) => `
      <div style="flex:1;min-width:30%;background:#f8f4ee;border-radius:10px;padding:10px;text-align:center">
        <div class="hint" style="margin:0">${label}</div>
        <div style="font-size:24px;font-weight:700">${o.view}</div>
        <div class="hint" style="margin:0">応募 ${o.apply}件</div>
      </div>`;
    const srcRows = Object.entries(s.bySource).sort((a,b) => b[1].view - a[1].view).map(([k,o]) =>
      `<tr><td>${esc(SRC_LABEL[k] || k)}</td><td>${o.view}</td><td>${o.form}</td><td>${o.apply}</td></tr>`).join("");
    const dayRows = s.daily.map(d =>
      `<tr><td>${esc(d.date.slice(5))}</td><td>${d.view}</td><td>${d.form}</td><td>${d.apply}</td></tr>`).join("");
    const th = `<tr style="color:var(--sub);font-size:12px"><td></td><td>閲覧</td><td>フォーム</td><td>応募</td></tr>`;
    $("stats").innerHTML = `
      <div style="display:flex;gap:8px;margin-top:12px">${box("今日", s.today)}${box("今月", s.month)}${box("累計", s.total)}</div>
      <p style="margin:12px 0 0;font-size:14px">
        累計：新しい人 <b>${s.total.new}</b>人 ／ 応募フォームを開いた <b>${s.total.form}</b>回 ／
        応募率 <b>${rate(s.total.apply, s.total.view)}</b>
      </p>
      <h3 style="font-size:15px;margin:16px 0 4px">流入元別（累計）</h3>
      <table class="shift-table">${th}${srcRows || '<tr><td colspan="4" class="hint">まだデータがありません</td></tr>'}</table>
      <h3 style="font-size:15px;margin:16px 0 4px">直近14日</h3>
      <table class="shift-table">${th}${dayRows}</table>
      <p class="hint">※同じ人が続けて開き直した分は1回として数えます。この端末（管理者）の閲覧は数えません。</p>`;
  } catch(e) { $("stats").innerHTML = `<p class="error">読み込み失敗：${esc(e.message)}<br>GASを最新版に更新・再デプロイしたか確認してください</p>`; }
}
$("statsReload").onclick = loadStats;

function renderSecs(){
  $("secList").innerHTML = C.sections.map((s,i) => `
    <div class="admin-sec">
      <div class="row">
        <input type="text" value="${esc(s.title)}" data-i="${i}" data-f="title" placeholder="見出し（例：給与）">
        <button class="icon-btn" data-act="up" data-i="${i}" title="上へ">↑</button>
        <button class="icon-btn" data-act="down" data-i="${i}" title="下へ">↓</button>
        <button class="icon-btn" data-act="del" data-i="${i}" title="削除">✕</button>
      </div>
      <textarea data-i="${i}" data-f="body" placeholder="本文">${esc(s.body)}</textarea>
    </div>`).join("");
}
$("secList").addEventListener("input", e => {
  const el = e.target; if (el.dataset.f) C.sections[el.dataset.i][el.dataset.f] = el.value;
});
$("secList").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const i = +b.dataset.i, a = C.sections;
  if (b.dataset.act === "del" && confirm(`「${a[i].title || "無題"}」を削除しますか？`)) a.splice(i,1);
  if (b.dataset.act === "up" && i > 0) [a[i-1],a[i]] = [a[i],a[i-1]];
  if (b.dataset.act === "down" && i < a.length-1) [a[i+1],a[i]] = [a[i],a[i+1]];
  renderSecs();
});
$("addSec").onclick = () => { C.sections.push({ title:"", body:"" }); renderSecs(); };

function collect(){
  document.querySelectorAll("[data-k]").forEach(el => C[el.dataset.k] = el.value.trim());
  C.sections = C.sections.filter(s => s.title.trim() || s.body.trim());
  return C;
}

$("saveBtn").onclick = async () => {
  if (uploading) { toast("アップロード完了までお待ちください"); return; }
  const data = collect();
  if (!GAS_URL) { toast("GAS_URL未設定のため保存できません"); return; }
  $("saveBtn").disabled = true; $("saveBtn").textContent = "保存中…";
  try {
    const j = await post({ action:"save", password: PW, content: data });
    if (!j.ok) throw new Error(j.error);
    toast("保存しました。本サイトに反映されています"); renderSecs();
  } catch(e){
    toast("保存失敗：" + e.message);
    if (/パスワード/.test(e.message)) logout();
  } finally { $("saveBtn").disabled = false; $("saveBtn").textContent = "保存して公開"; }
};
$("resetBtn").onclick = () => {
  if (confirm("初期値に戻しますか？（保存するまで公開はされません）")) { C = structuredClone(DEFAULT_CONTENT); fill(); }
};
function logout(){ sessionStorage.removeItem("recruit_pw"); PW=""; location.reload(); }
$("logoutBtn").onclick = logout;

// 再訪時の自動ログイン
if (PW && GAS_URL) post({ action:"login", password: PW }).then(j => j.ok ? enter() : sessionStorage.removeItem("recruit_pw")).catch(()=>{});
</script>
</body>
</html>
